# Keep the Mercos customer index inside its 1h MAX_AGE (customer_index.py):
# run the existing incremental sync every 30 minutes so lookup_customer_by_document
# (and, gated behind it, create_customer) never goes stale between customer
# registrations. Same pattern as outbox-retry.yml: a sub-30-minute Vercel
# cron is plan-dependent, this isn't. Never touches Mercos data directly —
# it only calls the app's own official sync endpoint, the same one the
# admin route and the (unscheduled) Vercel cron route already call.

name: Customer Index Sync

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  # Never stack runs: the app's own advisory lock already turns an overlap
  # into a same-tick skip, this just avoids piling up requests when GitHub
  # delays a schedule.
  group: customer-index-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run incremental customer sync
        env:
          AGENT_BASE_URL: ${{ secrets.AGENT_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${AGENT_BASE_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing AGENT_BASE_URL or CRON_SECRET secrets"
            exit 1
          fi
          BASE="${AGENT_BASE_URL%/}"
          curl -fsS --max-time 120 -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            "${BASE}/api/cron/commerce/sync/customers" \
            | tee /tmp/customer_sync.json
          python3 - <<'PY'
          import json, sys
          data = json.load(open("/tmp/customer_sync.json"))
          # Safe aggregate counters only — never a document, customer id or token.
          print("summary:", json.dumps({k: data.get(k) for k in (
              "ok", "pages", "records", "skipped", "error_code", "stopped_reason",
          )}))
          # sync_already_running just means an overlapping tick skipped — not a failure.
          if not data.get("ok", False) and data.get("error") != "sync_already_running":
              sys.exit(1)
          PY
