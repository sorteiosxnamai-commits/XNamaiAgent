name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Secret scan
        run: python scripts/scan_secrets.py

      - name: Release package dry-run
        run: python scripts/package_release.py --dry-run

      - name: Unit tests
        env:
          OPENAI_API_KEY: ""
          DATABASE_URL: ""
          DRY_RUN: "true"
          AUTO_CREATE_TABLES: "false"
        run: |
          python -m pytest -q \
            --ignore=tests/evals \
            -x \
            --tb=short

  # Optional heavier path — does not block on missing DB services yet.
  package-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify release scanner imports
        run: |
          python -c "import sys; sys.path.insert(0,'scripts'); import package_release, scan_secrets; print('ok')"
